start on started ui

script
  set +e
  export DISPLAY=:0
  export XAUTHORITY=/home/chronos/.Xauthority

  tries=10
  while [ "$tries" -gt 0 ]; do
    tries=$((tries - 1))
    xinput list >/dev/null 2>&1
    RC="$?"
    if [ "$RC" -eq 0 ]; then
      /opt/google/input/inputcontrol --refresh
      exit 0
    fi
    sleep 1
  done
end script
